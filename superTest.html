<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./superTest.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.32/dist/lenis.min.js"></script>
    <script src="./superTest.js" defer></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        height: 15%;
        background-color: red;
      }
      .content {
        flex-grow: 1;
        display: flex;
        justify-content: space-between;
      }
      .links {
        display: flex;
        height: 100%;
        justify-content: space-around;
        align-items: center;
        color: white;
      }
      .footer {
        height: 15%;
        background-color: blue;
      }
      .button {
        align-self: center;
      }
      .sidebar {
        background-color: green;
        width: 15%;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="links">
        <div class="link">Link 1</div>
        <div class="link">Link 2</div>
        <div class="link">Link 3</div>
      </div>
    </div>

    <div class="content">
      <div class="sidebar left"></div>
      <button class="button">Reverse</button>
      <div class="sidebar right"></div>
    </div>
    <div class="footer"></div>
  </body>
</html>
